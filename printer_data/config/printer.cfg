#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: PA1
sensor_pin: PF3 # TB port...Harness marked BT
sensor_type: ATC Semitec 104GT-2
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: -100
max_temp: 130

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[bed_mesh]
speed: 400
horizontal_move_z: 2
mesh_min: 7, 10
mesh_max: 203, 210
zero_reference_position: 108.5, 110.5
probe_count: 15, 15
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevD_A9E01BE04E5737374D202020FF10310F-if00
default_model_name: default #   Name of default beacon model to load.
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 30 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
home_method: proximity
home_method_when_homed: proximity
home_autocalibrate: never
contact_max_hotend_temperature: 235 # increase to probe at print temps
home_xy_position: 108.5, 100.5 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
# new autocalibration config options
#autocal_speed: 3
# Speed during contact movement. Probing outside of 2-5mm/s not recommended and at your own risk.
#autocal_accel: 100
# Acceleration of autocal movement.
#autocal_retract_dist: 2
# Retract distance between autocal samples.
#autocal_retract_speed: 10
# Speed of autocal retraction move.
#autocal_sample_count: 3
# Number of samples used for each autocal.
#autocal_tolerance: 0.008
# Acceptance tolerance for an autocal result.
#autocal_max_retries: 3
# Number of retry attempts permitted when tolerance is exceeded.

#[safe_z_home]
#home_xy_position: 112.5, 115.5 # Change coordinates to the center of your print bed
#z_hop: 1                 # Move up 1mm 
#z_hop_speed: 5

[screws_tilt_adjust]
screw1: 23, -2
screw1_name: Front left
screw2: 193, -2
screw2_name: Front right
screw3: 193, 168
screw3_name: Back right
screw4: 23, 168
screw4_name: Back left
screw_thread: CW-M4
horizontal_move_z: 2

# Required: Define the calibration boundaries
[axis_twist_compensation]
calibrate_start_x: 5
calibrate_end_x: 220
calibrate_y: 112.5
# For Y axis calibration, also add:
calibrate_start_y: 5
calibrate_end_y: 220
calibrate_x: 112.5

# Required: Enable this module (can be empty)
[axis_twist_compensation_beacon]
speed: 50                  # Travel speed between points (mm/s)
horizontal_move_z: 5       # Safe Z clearance height (mm)


#####################################################################
#   Sensors
#####################################################################

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu

#[temperature_sensor chamber]
#sensor_type: Trianglelab NTC100K B3950
#sensor_pin: PF5
#min_temp: 0
#max_temp: 100

[temperature_sensor chamber_bottom]
sensor_type: Trianglelab NTC100K B3950
sensor_pin: PF6
min_temp: 0
max_temp: 100

[temperature_sensor PTC_heater_coil]
sensor_type: Trianglelab NTC100K B3950
sensor_pin: PF7
min_temp: 0
max_temp: 145


#[filament_switch_sensor material_0]
#switch_pin: PG12

#[filament_switch_sensor material_3]
#switch_pin: PG15

#[filament_switch_sensor material_1]
#switch_pin: PG13

#[filament_switch_sensor material_2]
#switch_pin: PG14

# Thermistor ports TB pin: PF3 T0 pin: PF4 T1 pin: PF5 T2 pin: PF6 T3 pin: PF7

#####################################################################
#   Fans 6 CNC controlled, two always on
#####################################################################

[fan]
pin: PA8 #FAN0...Harness marked PART FAN

[heater_fan heatbreak_fan]
pin: PE5 #FAN1....Harness marked HB
heater: extruder
heater_temp: 50.0
fan_speed: 1.0


#[heater_fan fan2]
#pin: PD12 #FAN2

#[heater_fan fan3]
#pin: PD13 #FAN3

#[heater_fan fan4]
#pin: PD14 #FAN4

#[controller_fan fan5]
#pin: PD15 #FAN5

# FAN PORTS 6 AND 7 ALWAYS ON
# FAN7 Octopus case fans jumper set at 12v

#####################################################################
#   Servos
#####################################################################

[servo nozzle_brush]
pin: PB6 # BLTOUCH CONTROL PIN
#   PWM output pin controlling the servo. This parameter must be
#   provided.
maximum_servo_angle: 180
#   The maximum angle (in degrees) that this servo can be set to. The
#   default is 180 degrees.
minimum_pulse_width: 0.0005
#   The minimum pulse width time (in seconds). This should correspond
#   with an angle of 0 degrees. The default is 0.001 seconds.
maximum_pulse_width: 0.0025
#   The maximum pulse width time (in seconds). This should correspond
#   with an angle of maximum_servo_angle. The default is 0.002
#   seconds.
initial_angle: 90
#   Initial angle (in degrees) to set the servo to. The default is to
#   not send any signal at startup.

#####################################################################
# BLTOUCH PORT
#####################################################################

#[bltouch]
#sensor_pin: PB7
#control_pin: PB6
#z_offset: 0

#####################################################################
#   Added for Orca Slicer
#####################################################################

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

